<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#64138b">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>عارض الملزمة | منصة التميز</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/logo-purple.png">
  <link rel="apple-touch-icon" href="/assets/logo-purple.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css?v=20261108-06">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="viewer.js?v=20261108-07" defer></script>
</head>
<body>
  <header class="viewer-topbar">
    <a href="/" class="viewer-brand"><img src="/assets/logo-white.png" alt="منصة التميز"><span>منصة التميز</span></a>
    <div class="viewer-title"><small>عارض الملزمة</small><strong id="bookletTitle">جارٍ تحميل الملزمة…</strong></div>
    <a class="viewer-back" href="/">العودة للموقع ←</a>
  </header>

  <main class="viewer-main">
    <section class="viewer-toolbar" aria-label="أدوات العرض">
      <span class="viewer-secure"><i></i><b id="viewerSecureText">عرض محمي</b></span>

      <div class="viewer-toolbar-center">
        <div class="viewer-page-counter" aria-live="polite">
          صفحة <b id="pageNum">1</b> من <b id="pageCount">—</b>
        </div>
        <div class="viewer-toolbar-actions">
          <div class="viewer-pages">
            <button id="prevPage" type="button" disabled>السابق</button>
            <button id="nextPage" type="button" disabled>التالي</button>
          </div>
          <div class="viewer-zoom">
            <button id="zoomOut" type="button" disabled aria-label="تصغير">−</button>
            <span id="zoomLabel">100%</span>
            <button id="zoomIn" type="button" disabled aria-label="تكبير">+</button>
          </div>
        </div>
      </div>
    </section>

    <section class="viewer-stage" id="viewerStage" aria-label="صفحات الملزمة">
      <div class="viewer-loading" id="viewerLoading">
        <div class="spinner"></div>
        <strong>جارٍ تجهيز المعاينة</strong>
        <span>يتم تجهيز صفحات الملزمة للعرض داخل الموقع.</span>
      </div>
      <div class="viewer-error" id="viewerError" hidden></div>
      <div class="pdf-pages" id="pdfPages" hidden></div>
    </section>
  </main>
</body>
</html>
